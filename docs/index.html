<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BassAction — Solar Automation</title>
<style>
  :root {
    --bg:#0f1419; --card:#1a212b; --line:#2a3441; --txt:#e6edf3; --dim:#8b98a5;
    --ok:#3fb950; --warn:#d29922; --off:#f85149; --accent:#58a6ff;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--txt); }
  header { padding:20px 16px 8px; max-width:1000px; margin:0 auto; }
  h1 { margin:0; font-size:20px; }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .wrap { max-width:1000px; margin:0 auto; padding:12px 16px 40px;
          display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .card.rules { grid-column:1 / -1; }
  .row { display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .k { color:var(--dim); }
  .v { font-weight:600; font-variant-numeric:tabular-nums; }
  .big { font-size:34px; font-weight:700; margin:2px 0 6px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.on { background:rgba(63,185,80,.18); color:var(--ok); }
  .pill.off { background:rgba(248,81,73,.16); color:var(--off); }
  .pill.dim { background:rgba(139,152,165,.16); color:var(--dim); }
  .bar { height:10px; border-radius:6px; background:var(--line); overflow:hidden; margin:8px 0 12px; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#3fb950,#58a6ff); }
  .err { color:var(--off); font-size:13px; }
  .actions { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--dim); white-space:pre-wrap; }
  footer { text-align:center; color:var(--dim); font-size:12px; padding:0 16px 30px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🛁 BassAction <span id="mode" class="pill dim" style="vertical-align:middle"></span></h1>
  <div class="sub" id="updated">loading…</div>
</header>
<div class="wrap" id="cards"></div>
<footer id="foot">Auto-refreshes every 60 s · read-only · data via GitHub Actions</footer>

<script>
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const pill = (on, onTxt='on', offTxt='off') => on==null
  ? `<span class="pill dim">?</span>`
  : `<span class="pill ${on?'on':'off'}">${on?onTxt:offTxt}</span>`;
const n = (v, u='', d=0) => v==null ? '—' : (typeof v==='number' ? v.toFixed(d) : v) + u;

function card(title, rowsHtml) {
  return `<div class="card"><h2>${title}</h2>${rowsHtml}</div>`;
}
function row(k, v) { return `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`; }

function render(s) {
  const dev = s.devices || {};
  const devTxt = dev.fresh ? '· spa/AC: live' : (dev.ageSec != null ? `· spa/AC: cached ${Math.round(dev.ageSec/60)}m` : '');
  document.getElementById('updated').textContent =
    'Updated ' + new Date(s.updatedAt).toLocaleString() +
    (s.localTime ? `  ·  Prague ${String(s.localTime.hour).padStart(2,'0')}:00` : '') +
    (devTxt ? '  ' + devTxt : '');

  const ver = s.version ? `v${s.version}` : '';
  const dep = s.deployedAt ? `deployed ${new Date(s.deployedAt).toLocaleString()}` : '';
  document.getElementById('foot').textContent =
    ['Auto-refreshes every 60 s · read-only', ver, dep].filter(Boolean).join(' · ');
  const mode = document.getElementById('mode');
  mode.textContent = s.controlEnabled ? 'CONTROL ON' : 'read-only';
  mode.className = 'pill ' + (s.controlEnabled ? 'on' : 'dim');

  const cards = [];

  // Solar
  const g = s.solar || {};
  if (g.ok) {
    const soc = g.batterySOC ?? 0;
    const src = g.source === 'esp-local' ? 'local ESP' : g.source === 'sems' ? 'SEMS cloud' : '';
    cards.push(card('☀️ Solar / Battery',
      `<div class="big">${n(g.batterySOC,'%')}</div>
       <div class="bar"><i style="width:${Math.max(0,Math.min(100,soc))}%"></i></div>` +
      (src ? row('Source', `<span class="v">${src}</span>`) : '') +
      row('Battery', (g.charging===true?'charging ▲':g.charging===false?'discharging ▼':'—') + ' ' + n(g.batteryPower,' W')) +
      row('PV', n(g.pvPower,' W')) +
      row('Load', n(g.loadPower,' W')) +
      row('Grid', n(g.gridPower,' W')) +
      row('Today', n(g.energyToday,' kWh',1))));
  } else {
    cards.push(card('☀️ Solar / Battery', `<div class="err">${g.error||'unavailable'}</div>`));
  }

  // MSpa
  const m = s.mspa || {};
  if (m.ok) {
    cards.push(card('🛁 MSpa',
      `<div class="big">${n(m.waterTempC,'°',1)} <span style="font-size:14px;color:var(--dim)">→ ${n(m.targetTempC,'°',1)}</span></div>` +
      row('Online', pill(m.online)) +
      row('Heater', pill(m.heater)) +
      row('Filter', pill(m.filter)) +
      row('Ozone / UVC', pill(m.ozone)+' '+pill(m.uvc)) +
      row('Bubbles', pill(m.bubble))));
  } else {
    cards.push(card('🛁 MSpa', `<div class="err">${m.error||'unavailable'}</div>`));
  }

  // AC
  const a = s.ac || {};
  if (a.ok) {
    cards.push(card('❄️ Toshiba AC',
      `<div class="big">${n(a.indoorTemp,'°')} <span style="font-size:14px;color:var(--dim)">→ ${n(a.targetTemp,'°')}</span></div>` +
      row('Power', pill(a.on)) +
      row('Mode', `<span class="v">${a.mode||'—'}</span>`) +
      row('Fan', `<span class="v">${a.fan||'—'}</span>`) +
      row('Outdoor', n(a.outdoorTemp,'°'))));
  } else {
    cards.push(card('❄️ Toshiba AC', `<div class="err">${a.error||'unavailable'}</div>`));
  }

  // Automation
  const au = s.automation || {};
  const dec = (d) => d ? (d.action ? `${d.action} — ${d.note}` : d.note) : '—';
  cards.push(card('⚙️ Automation',
    row('SOC seen', n(au.soc,'%')) +
    row('MSpa owned by auto', pill(au.ownership&&au.ownership.mspa, 'yes','no')) +
    row('AC owned by auto', pill(au.ownership&&au.ownership.ac, 'yes','no')) +
    `<div class="row"><span class="k">MSpa heater</span></div><div class="actions">${dec(au.mspaHeater)}</div>` +
    `<div class="row"><span class="k">AC</span></div><div class="actions">${dec(au.ac)}</div>` +
    `<div class="row"><span class="k">Filtration</span></div><div class="actions">${au.filtration?au.filtration.note:'—'}</div>`));

  // Last actions (this run only)
  if (s.actions && s.actions.length)
    cards.push(card('📋 Last run actions', `<div class="actions">${s.actions.join('\n')}</div>`));

  // History (persisted, newest first)
  if (s.history && s.history.length) {
    const rows = s.history.map(h => {
      const t = new Date(h.ts).toLocaleString();
      const soc = h.soc != null ? ` (${h.soc}%)` : '';
      return `${t}${soc} — ${h.text}`;
    }).join('\n');
    cards.push(card('🕘 History (last 10)', `<div class="actions">${rows}</div>`));
  }

  // Rules (the active config the engine is running — single source of truth)
  const r = s.rules;
  if (r) {
    const filt = (r.filtration || []).map(c => {
      const hh = String(c.hour).padStart(2,'0');
      const what = c.ozone ? 'filter + UVC + ozone' : 'filter + UVC';
      const days = c.weekdaysOnly ? 'weekdays' : 'daily';
      return `${hh}:00 · ${c.minutes} min · ${what} · ${days}`;
    }).join('\n');
    cards.push(`<div class="card rules"><h2>📜 Rules (live config)</h2>` +
      row('Spa heat', `start ≥ ${r.socStart.mspa}% SOC · stop ≤ ${r.socStop.mspa}% or water ≥ target`) +
      row('Aircon', `start ≥ ${r.socStart.ac}% SOC · stop ≤ ${r.socStop.ac}% or ${r.acStopMarginC}° past target`) +
      row('Heater start gap', `only if water ≥ ${r.mspaTempMargin}° below target`) +
      row('Daytime window', `${String(r.dayStartHour).padStart(2,'0')}:00–${String(r.nightOffHour).padStart(2,'0')}:00 · auto-off at night`) +
      row('Anti-cycle', `min ${r.minOnMin} min on · ${r.minOffMin} min off`) +
      row('Manual override', `pauses auto for ${r.overrideHr} h after you touch a device`) +
      row('AC priority', `blocks spa heater when room ≥ ${r.acPriorityBlockC}° over AC target`) +
      `<div class="row"><span class="k">Filtration cycles</span></div><div class="actions">${filt||'—'}</div>` +
      `</div>`);
  }

  document.getElementById('cards').innerHTML = cards.join('');
}

// Status now lives in a Gist (no per-run repo commits). Falls back to a local
// file when the Gist id hasn't been filled in (e.g. local preview).
const GIST_ID = 'c7fa211c4f361f51cc9c10053fb6e842';
const STATUS_URL = GIST_ID.startsWith('REPLACE')
  ? './status.json'
  : `https://gist.githubusercontent.com/petrji/${GIST_ID}/raw/status.json`;

async function load() {
  try {
    const r = await fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    render(await r.json());
  } catch (e) {
    document.getElementById('updated').innerHTML = '<span class="err">No status yet — waiting for the first run.</span>';
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
