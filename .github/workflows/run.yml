name: BassAction

on:
  repository_dispatch:        # the ESP pushes SOC here (event_type: soc) → instant run
    types: [soc]
  schedule:
    - cron: '*/15 * * * *'   # heartbeat / filtration even if the ESP is offline
  workflow_dispatch:          # manual "Run workflow" button

# Don't let two runs overlap (and don't cancel an in-flight one mid-command).
concurrency:
  group: bassaction
  cancel-in-progress: false

permissions:
  contents: read              # state + dashboard live in a Gist now — no repo writes

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Capture deployed version
        run: |
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "GIT_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: Run automation
        env:
          CONTROL_ENABLED:      ${{ vars.CONTROL_ENABLED }}
          SOC_OVERRIDE:         ${{ github.event.client_payload.soc }}
          READ_INTERVAL_MIN:    ${{ vars.READ_INTERVAL_MIN }}
          MSPA_SOC_START:       ${{ vars.MSPA_SOC_START }}
          MSPA_SOC_STOP:        ${{ vars.MSPA_SOC_STOP }}
          AC_SOC_START:         ${{ vars.AC_SOC_START }}
          AC_SOC_STOP:          ${{ vars.AC_SOC_STOP }}
          GIST_ID:              ${{ vars.GIST_ID }}
          GIST_TOKEN:           ${{ secrets.GIST_TOKEN }}
          SEMS_ACCOUNT:         ${{ secrets.SEMS_ACCOUNT }}
          SEMS_PASSWORD:        ${{ secrets.SEMS_PASSWORD }}
          SEMS_STATION_ID:      ${{ secrets.SEMS_STATION_ID }}
          MSPA_APP_ID:          ${{ secrets.MSPA_APP_ID }}
          MSPA_APP_SECRET:      ${{ secrets.MSPA_APP_SECRET }}
          MSPA_ACCOUNT:         ${{ secrets.MSPA_ACCOUNT }}
          MSPA_PASS_MD5:        ${{ secrets.MSPA_PASS_MD5 }}
          MSPA_DEVICE_ID:       ${{ secrets.MSPA_DEVICE_ID }}
          MSPA_PRODUCT_ID:      ${{ secrets.MSPA_PRODUCT_ID }}
          TOSHIBA_USER:         ${{ secrets.TOSHIBA_USER }}
          TOSHIBA_PASS:         ${{ secrets.TOSHIBA_PASS }}
          TOSHIBA_CLIENT_ID:    ${{ secrets.TOSHIBA_CLIENT_ID }}
          TOSHIBA_AC_UNIQUE_ID: ${{ secrets.TOSHIBA_AC_UNIQUE_ID }}
        run: npm start
        # No commit step: state + status are written to the Gist via the API.
